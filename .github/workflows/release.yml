name: Release

# Pushing a tag like v0.2.0 or v0.2.0-beta builds the Windows, macOS and Linux packages and creates a DRAFT release with them attached.
# The draft is for you to read, try and publish by hand (a tag with a "-" in it, like -beta, is marked as a pre-release). See docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tools/fetch_onnxruntime.cmake') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Ninja
        run: choco install ninja --no-progress -y
      - name: ONNX Runtime
        shell: bash
        run: '[ -d third_party/onnxruntime/include ] || cmake -P tools/fetch_onnxruntime.cmake "$GITHUB_WORKSPACE/third_party/onnxruntime"'
      - name: Build and check
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRUMLINE_ORT_DIR="$GITHUB_WORKSPACE/third_party/onnxruntime"
          cmake --build build --parallel
          ./build/plugin/strumline_check.exe
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: ./package.ps1 -SkipBuild -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tools/fetch_onnxruntime.cmake') }}
      - name: Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: ONNX Runtime
        run: '[ -d third_party/onnxruntime/include ] || cmake -P tools/fetch_onnxruntime.cmake "$GITHUB_WORKSPACE/third_party/onnxruntime"'
      - name: Build and check
        run: |
          STRUMLINE_ORT_DIR="$GITHUB_WORKSPACE/third_party/onnxruntime" ./build.sh
          ./build/plugin/strumline_check
      - name: Package
        run: ./package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tools/fetch_onnxruntime.cmake') }}
      - name: Tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb
      - name: ONNX Runtime
        run: '[ -d third_party/onnxruntime/include ] || cmake -P tools/fetch_onnxruntime.cmake "$GITHUB_WORKSPACE/third_party/onnxruntime"'
      - name: Build and check
        run: |
          STRUMLINE_ORT_DIR="$GITHUB_WORKSPACE/third_party/onnxruntime" ./build.sh
          xvfb-run -a ./build/plugin/strumline_check
      - name: Package
        run: ./package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  draft-release:
    name: Draft release
    needs: [windows, macos, linux]
    # A draft is only a draft: when macOS or Linux fail, the Windows packages are still attached and you decide what to do.
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section "## [<version>] - date" of CHANGELOG.md, up to the next "## [".
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" > notes.md; fi
          {
            echo
            echo "## Checksums (SHA-256)"
            echo '```'
            cat packages/SHA256SUMS*.txt
            echo '```'
          } >> notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--draft"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "Strumline ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            packages/*
