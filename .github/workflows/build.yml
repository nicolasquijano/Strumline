# Builds Strumline on Windows, macOS and Linux and runs the checks that need no audio device. This is how the macOS and Linux builds are verified
# (they cannot be built on the Windows machine the project is developed on).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # JUCE builds from the same folder layout Schematic Amp Sim uses; here it is fetched by CMake (FetchContent), so nothing else is needed.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: ONNX Runtime (for the chord converter)
        shell: bash
        run: cmake -P tools/fetch_onnxruntime.cmake "$GITHUB_WORKSPACE/third_party/onnxruntime"

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRUMLINE_ORT_DIR="$GITHUB_WORKSPACE/third_party/onnxruntime"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      # strumline_check needs no host and no audio device. It plays a strummed chord in real time, so a slow runner can make its timing lines flaky.
      - name: Check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ./build/plugin/strumline_check; else ./build/plugin/strumline_check*; fi

      - name: Collect the plug-in and the program
        shell: bash
        run: |
          mkdir -p out
          cp -R build/plugin/Strumline_artefacts/Release/VST3 out/ || true
          cp -R build/plugin/Strumline_artefacts/Release/Standalone out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: strumline-${{ matrix.name }}
          path: out
